name: Deploy CleverWeb

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CleverWeb/CleverWeb.csproj

      - name: Build
        run: dotnet build CleverWeb/CleverWeb.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish CleverWeb/CleverWeb.csproj --configuration Release --output ./publish --no-build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/cleverweb_deploy
          chmod 600 ~/.ssh/cleverweb_deploy
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          echo "Usuário configurado: ${{ secrets.VPS_USER }}"
          echo "Porta configurada: ${{ secrets.VPS_PORT }}"
          echo "Host configurado: ${{ secrets.VPS_HOST }}"

          ssh -vvv \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/cleverweb_deploy \
            -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo SSH_OK"s.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo SSH_OK"

      - name: Deploy
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/cleverweb_deploy -p ${{ secrets.VPS_PORT }}" \
            ./publish/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/gestaoieada/

      - name: Restart application
        run: |
          ssh \
            -i ~/.ssh/cleverweb_deploy \
            -p ${{ secrets.VPS_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo systemctl restart gestaoieada"
